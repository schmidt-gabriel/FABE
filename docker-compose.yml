services:
  backend:
    build: ./backend
    ports:
      - "8090:8090"
    volumes:
      - pb_data:/app/pb_data
    # Optional master superuser: set both to auto-create/sync a login on
    # startup (skips the manual pbinstall step). Leave unset to disable.
    environment:
      - MASTER_EMAIL=${MASTER_EMAIL:-}
      - MASTER_PASSWORD=${MASTER_PASSWORD:-}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - BACKEND_URL=http://backend:8090
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pb_data:
