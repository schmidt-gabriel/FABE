# Kubernetes manifests for financeApp (backend + frontend).
#
# Mirrors docker-compose: the backend is PocketBase (API + SQLite in a
# persistent volume) and the frontend is the Vite server, which proxies /api
# and /_ to the backend, so only the frontend is exposed to the browser.
#
# Apply:   kubectl apply -f k8s.yaml
# Images:  built and pushed by CI to ghcr.io/schmidt-gabriel/financeapp-*:latest
#
# Before applying, review: the master credentials Secret, the storage size,
# and the Ingress host (or swap the Ingress for a LoadBalancer/NodePort).
---
apiVersion: v1
kind: Namespace
metadata:
  name: financeapp
---
# Optional master superuser. main.go upserts this login on startup so a fresh
# deploy works without the manual pbinstall step. CHANGE THESE before applying
# (or delete this Secret and the backend envFrom to disable).
apiVersion: v1
kind: Secret
metadata:
  name: financeapp-master
  namespace: financeapp
type: Opaque
stringData:
  MASTER_EMAIL: "admin@example.com"
  MASTER_PASSWORD: "change-me-please"
---
# SQLite data (pb_data). ReadWriteOnce: the backend must stay single-replica.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: financeapp-pb-data
  namespace: financeapp
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # storageClassName: standard   # uncomment to pin a class; omit to use the default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: financeapp-backend
  namespace: financeapp
  labels:
    app.kubernetes.io/name: financeapp
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  # SQLite on a ReadWriteOnce volume: never run two writers, and release the
  # volume before the new pod starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: financeapp
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: financeapp
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/schmidt-gabriel/financeapp-backend:latest
          ports:
            - name: http
              containerPort: 8090
          envFrom:
            - secretRef:
                name: financeapp-master
          volumeMounts:
            - name: pb-data
              mountPath: /app/pb_data
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: pb-data
          persistentVolumeClaim:
            claimName: financeapp-pb-data
      # If the ghcr packages are private, create a pull secret and reference it:
      #   kubectl -n financeapp create secret docker-registry ghcr-pull \
      #     --docker-server=ghcr.io --docker-username=USER --docker-password=TOKEN
      # imagePullSecrets:
      #   - name: ghcr-pull
---
apiVersion: v1
kind: Service
metadata:
  name: financeapp-backend
  namespace: financeapp
spec:
  selector:
    app.kubernetes.io/name: financeapp
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: financeapp-frontend
  namespace: financeapp
  labels:
    app.kubernetes.io/name: financeapp
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: financeapp
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: financeapp
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/schmidt-gabriel/financeapp-frontend:latest
          ports:
            - name: http
              containerPort: 5173
          env:
            # In-cluster backend address for the Vite proxy (/api, /_).
            - name: BACKEND_URL
              value: "http://financeapp-backend:8090"
            # Vite 6 blocks unknown Host headers. When serving via the Ingress
            # below, set this to that host (comma-separated for several).
            - name: ALLOWED_HOSTS
              value: "financeapp.example.com"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      # imagePullSecrets:
      #   - name: ghcr-pull
---
apiVersion: v1
kind: Service
metadata:
  name: financeapp-frontend
  namespace: financeapp
spec:
  selector:
    app.kubernetes.io/name: financeapp
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 5173
      targetPort: http
---
# Exposes the frontend (which proxies API calls to the backend). Adjust the
# host and ingressClassName to your cluster, or delete this and expose the
# frontend Service as LoadBalancer/NodePort instead.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: financeapp
  namespace: financeapp
spec:
  # ingressClassName: nginx
  rules:
    - host: financeapp.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: financeapp-frontend
                port:
                  number: 5173
